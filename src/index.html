<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1330" />
    <meta name="description" content="ExamHero Pro: study smart, pass any exam. WAEC, NECO and JAMB practice." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>ExamHero Pro</title>
    <style>
      html, body, #root { margin: 0; background: #0A1330; min-height: 100vh; }
      /* Shown instantly on app open, until the React app takes over. */
      #splash {
        position: fixed; inset: 0; z-index: 99;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0A1330; color: #F5F5F0;
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
        transition: opacity 300ms ease-out;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
      #splash .name { font-size: 26px; font-weight: 800; letter-spacing: -0.4px; }
      #splash .name span { color: #F2B91B; }
      #splash .tag { font-size: 14px; color: #9AA6D1; }
      #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #2A3878; overflow: hidden; margin-top: 10px; }
      #splash .bar i { display: block; width: 40%; height: 100%; background: #F2B91B; border-radius: 4px; animation: eh-load 1.1s ease-in-out infinite; }
      @keyframes eh-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img src="/icon-512.png" alt="ExamHero Pro logo" />
      <div class="name">Exam<span>Hero</span> PRO</div>
      <div class="tag">Study smart, pass any exam</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
